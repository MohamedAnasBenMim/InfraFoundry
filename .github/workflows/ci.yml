name: CI
on: [push, pull_request]
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: infrafoundry-demo
      - run: python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('ansible').rglob('*.yml')]"
