- name: Install nginx application service
  ansible.builtin.package:
    name: nginx
    state: present

- name: Publish health endpoint
  ansible.builtin.copy:
    dest: /var/www/html/health
    content: 'healthy'
    owner: root
    group: root
    mode: '0644'

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
